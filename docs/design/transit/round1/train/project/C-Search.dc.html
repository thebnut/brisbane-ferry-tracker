<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a trip, Line First</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#4B32C4}a:hover{color:#36239A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; font-family: 'Figtree', system-ui, sans-serif; color: #1D2226; display: flex; flex-direction: column">
  <header style="padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="C-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1D2226; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <div><div style="font-size: 12px; font-weight: 700; color: #4F5860; letter-spacing: 0.06em">FROM</div><div style="font-size: 20px; font-weight: 800">Roma Street</div></div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #DDE0E5; border-radius: 16px; padding: 0 14px; min-height: 52px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4F5860" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Destination</span>
      <input placeholder="Where to? Pick a line or type" style="flex: 1; border: 0; font: inherit; font-size: 16px; outline: none; background: transparent">
    </label>
    <div style="font-size: 13px; color: #4F5860">9 lines leave Roma Street. Only stations you can reach without changing are shown.</div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="background: #FFFFFF; border: 1px solid #E6E8EC; border-radius: 20px; padding: 12px 16px">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 36px">
          <span style="{{g.chip}}">{{g.name}}</span>
          <span style="flex: 1; font-size: 13px; color: #4F5860">{{g.meta}}</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4F5860">{{g.count}}</span>
        </div>
        <sc-for list="{{g.stations}}" as="s" hint-placeholder-count="3">
          <button style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 44px; border: 0; background: transparent; padding: 0; font: inherit; color: inherit; text-align: left">
            <span style="width: 18px; align-self: stretch; display: flex; justify-content: center; position: relative"><span style="{{g.rail}}"></span><span style="{{s.dot}}"></span></span>
            <span style="{{s.label}}">{{s.name}}</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4F5860">{{s.mins}}</span>
          </button>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <div style="height: 26px"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (name, color, meta, count, list, dark) => ({
      name, meta, count,
      chip: 'font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: ' + (dark ? '#1D2226' : '#FFFFFF') + '; background: ' + color,
      rail: 'position: absolute; top: 0; bottom: 0; width: 5px; background: ' + color,
      stations: list.map(([n, m, k]) => ({
        name: n, mins: m,
        dot: 'position: relative; align-self: center; box-sizing: border-box; border-radius: 50%; ' + (k === 'skip' ? 'width: 10px; height: 10px; background: #FFFFFF; border: 2px solid ' + color : k === 'pick' ? 'width: 18px; height: 18px; background: #5B3FD1; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #5B3FD1' : 'width: 14px; height: 14px; background: #FFFFFF; border: 4px solid ' + color),
        label: 'flex: 1; font-size: 16px; ' + (k === 'skip' ? 'color: #6A737B' : k === 'pick' ? 'font-weight: 800; color: #4B32C4' : 'font-weight: 600')
      }))
    });
    return { groups: [
      mk('Springfield', '#0A7A6E', 'Express west', '4 stations', [['Milton', 'express skips', 'skip'], ['Toowong', '6 min', ''], ['Indooroopilly', '12 min', 'pick'], ['Springfield Central', '35 min', '']]),
      mk('Ipswich/Rosewood', '#1E9F4A', 'All stops west', '23 stations', [['Milton', '3 min', ''], ['Auchenflower', '5 min', ''], ['Toowong', '7 min', '']]),
      mk('Ferny Grove', '#6A4C9C', 'North-west', '10 stations', [['Windsor', '8 min', '']])
    ]};
  }
}
</script>
</body>
</html>
