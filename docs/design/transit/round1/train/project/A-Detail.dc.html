<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service detail, Ferry Sibling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#5B3FD1}a:hover{color:#432CA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFBF4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <div style="height: 200px; position: relative; background: #EAF1EE; overflow: hidden">
    <svg width="390" height="200" viewBox="0 0 390 200" aria-hidden="true" style="position: absolute; inset: 0">
      <path d="M-10 150 C 60 120, 120 170, 190 140 S 320 90, 400 120" fill="none" stroke="#BFD9E6" stroke-width="22"></path>
      <path d="M20 40 L 120 70 L 200 90 L 290 120 L 380 170" fill="none" stroke="#0A7A6E" stroke-width="6" stroke-linecap="round"></path>
      <circle cx="20" cy="40" r="7" fill="#FFFFFF" stroke="#0A7A6E" stroke-width="4"></circle>
      <circle cx="200" cy="90" r="7" fill="#FFFFFF" stroke="#0A7A6E" stroke-width="4"></circle>
      <circle cx="290" cy="120" r="9" fill="#5B3FD1" stroke="#FFFFFF" stroke-width="4"></circle>
      <circle cx="74" cy="56" r="16" fill="#5B3FD1" opacity="0.2"></circle>
      <circle cx="74" cy="56" r="9" fill="#5B3FD1" stroke="#FFFFFF" stroke-width="3"></circle>
    </svg>
    <a href="A-Departures.dc.html" aria-label="Back" style="position: absolute; top: 14px; left: 14px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2D3436; box-shadow: 0 2px 8px rgba(0,0,0,0.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <div style="position: absolute; left: 14px; bottom: 12px; background: #FFFFFF; border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.12)">Leaving Roma Street · GPS 20 s ago</div>
  </div>
  <section style="margin: -18px 12px 0; position: relative; background: #FFFFFF; border-radius: 20px; box-shadow: 0 4px 16px rgba(45,52,54,0.12); padding: 16px">
    <div style="display: flex; gap: 6px"><span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #E3F4E8; color: #17602E">● LIVE · GPS</span><span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #2D3436; color: #FFFFFF">EXPRESS</span><span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #0A7A6E; color: #FFFFFF">Springfield line</span></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 8px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">8:07 to Springfield Central</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
      <div style="background: #F7F3EC; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; font-weight: 700; color: #5F6B6E">DEPARTS</div><div style="font-size: 17px; font-weight: 800">3 min</div></div>
      <div style="background: #F7F3EC; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; font-weight: 700; color: #5F6B6E">TRIP</div><div style="font-size: 17px; font-weight: 800">12 min</div></div>
      <div style="background: #F7F3EC; border-radius: 12px; padding: 8px 10px"><div style="font-size: 11px; font-weight: 700; color: #5F6B6E">PLATFORM</div><div style="font-size: 17px; font-weight: 800">8</div></div>
    </div>
    <div style="margin-top: 12px; display: flex; align-items: center; gap: 10px">
      <span style="font-size: 13px; font-weight: 700; width: 92px">Many seats</span>
      <div aria-label="Occupancy by carriage: mostly many seats" role="img" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
        <span style="height: 14px; border-radius: 4px; background: #5B3FD1; opacity: 0.35"></span><span style="height: 14px; border-radius: 4px; background: #5B3FD1; opacity: 0.35"></span><span style="height: 14px; border-radius: 4px; background: #5B3FD1; opacity: 0.6"></span><span style="height: 14px; border-radius: 4px; background: #5B3FD1"></span><span style="height: 14px; border-radius: 4px; background: #5B3FD1; opacity: 0.6"></span><span style="height: 14px; border-radius: 4px; background: #5B3FD1; opacity: 0.35"></span>
      </div>
    </div>
    <div style="font-size: 12px; color: #5F6B6E; margin-top: 4px">Quietest at the front and back carriages</div>
  </section>
  <section style="flex: 1; overflow: hidden; padding: 16px 20px 0">
    <h2 style="margin: 0 0 8px; font-size: 14px; font-weight: 800; letter-spacing: 0.04em; color: #5F6B6E">STOPPING PATTERN</h2>
    <sc-for list="{{stops}}" as="s" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 40px">
        <div style="width: 20px; align-self: stretch; display: flex; justify-content: center; position: relative">
          <span style="position: absolute; top: 0; bottom: 0; width: 6px; background: #0A7A6E"></span>
          <span style="{{s.dot}}"></span>
        </div>
        <span style="{{s.label}}">{{s.name}}</span>
        <span style="{{s.timeStyle}}">{{s.time}}</span>
      </div>
    </sc-for>
  </section>
  <div style="padding: 10px 16px 28px; display: flex; gap: 10px">
    <button style="flex: 1; min-height: 52px; border-radius: 16px; border: 2px solid #5B3FD1; background: #FFFFFF; color: #3F2A9E; font: inherit; font-weight: 700">Remind me</button>
    <button style="flex: 1; min-height: 52px; border-radius: 16px; border: 0; background: #5B3FD1; color: #FFFFFF; font: inherit; font-weight: 700">Share trip</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Roma Street', '8:07', 'board'], ['Milton', 'skips', 'skip'], ['Auchenflower', 'skips', 'skip'],
      ['Toowong', '8:13', 'stop'], ['Taringa', 'skips', 'skip'], ['Indooroopilly', '8:19 · you get off', 'you'],
      ['Darra', '8:27', 'stop'], ['Springfield Central', '8:42', 'stop']
    ];
    const base = 'position: relative; box-sizing: border-box; border-radius: 50%; ';
    const stops = rows.map(([name, time, k]) => ({
      name, time,
      dot: base + (k === 'skip' ? 'width: 10px; height: 10px; margin-top: 15px; background: #FFFFFF; border: 2px solid #0A7A6E'
        : k === 'stop' ? 'width: 14px; height: 14px; margin-top: 13px; background: #FFFFFF; border: 4px solid #0A7A6E'
        : 'width: 20px; height: 20px; margin-top: 10px; background: #5B3FD1; border: 4px solid #FFFFFF; box-shadow: 0 0 0 2px #5B3FD1'),
      label: 'flex: 1; font-size: 16px; ' + (k === 'skip' ? 'color: #6B7477' : 'font-weight: 700'),
      timeStyle: 'font-size: 14px; ' + (k === 'skip' ? 'color: #6B7477' : k === 'you' ? 'font-weight: 800; color: #3F2A9E' : 'font-weight: 600')
    }));
    return { stops };
  }
}
</script>
</body>
</html>
