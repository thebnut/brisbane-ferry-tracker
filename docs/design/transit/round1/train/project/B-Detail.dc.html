<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Service detail, Platform Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4A2FC0}a:hover{color:#331F8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EDEDEA; font-family: 'Barlow Condensed', system-ui, sans-serif; color: #111315; display: flex; flex-direction: column">
  <header style="background: #111315; color: #FFFFFF; padding: 12px 14px 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="B-Departures.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; margin-left: -10px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <span style="display: flex; gap: 6px"><span style="font-size: 14px; font-weight: 700; padding: 2px 7px; background: #0A7A6E">SPRINGFIELD</span><span style="font-size: 14px; font-weight: 700; padding: 2px 7px; border: 1.5px solid #FFFFFF">EXPRESS</span></span>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 14px; margin-top: 8px">
      <div style="width: 72px; height: 72px; background: #FFFFFF; color: #111315; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em">PLAT</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 800; line-height: 1">8</span></div>
      <div style="flex: 1">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 800; line-height: 1">08:07</div>
        <h1 style="margin: 2px 0 0; font-size: 28px; font-weight: 800; text-transform: uppercase; line-height: 1">Springfield Central</h1>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 12px; font-size: 16px; font-weight: 600; color: #D5D7DA"><span style="color: #7BE09A; font-weight: 700">● LIVE · GPS 20 S AGO</span><span>DUE <span style="font-family: 'JetBrains Mono', monospace; color: #FFFFFF; font-weight: 800">3 MIN</span></span></div>
  </header>
  <section style="background: #FFFFFF; margin: 10px 10px 0; padding: 12px 14px; border-radius: 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase">Carriages</h2><span style="font-size: 15px; font-weight: 600">FRONT → </span></div>
    <div role="img" aria-label="Six carriages: front two many seats, middle two few seats, back two many seats" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
      <span style="height: 36px; border: 2px solid #111315; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">MANY</span>
      <span style="height: 36px; border: 2px solid #111315; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">MANY</span>
      <span style="height: 36px; border: 2px solid #111315; background: #5B3FD1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">FEW</span>
      <span style="height: 36px; border: 2px solid #111315; background: #5B3FD1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">FEW</span>
      <span style="height: 36px; border: 2px solid #111315; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">MANY</span>
      <span style="height: 36px; border: 2px solid #111315; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">MANY</span>
    </div>
    <div style="font-size: 14px; color: #33373C; margin-top: 6px">Board at the front or back for a seat.</div>
  </section>
  <section style="background: #FFFFFF; margin: 10px 10px 0; padding: 12px 14px 4px; border-radius: 4px; flex: 1; overflow: hidden">
    <h2 style="margin: 0 0 6px; font-size: 18px; font-weight: 800; text-transform: uppercase">Stopping pattern</h2>
    <sc-for list="{{stops}}" as="s" hint-placeholder-count="8">
      <div style="{{s.row}}">
        <span style="{{s.mark}}"></span>
        <span style="{{s.name}}">{{s.label}}</span>
        <span style="{{s.status}}">{{s.state}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; width: 50px; text-align: right">{{s.time}}</span>
      </div>
    </sc-for>
  </section>
  <div style="padding: 10px 10px 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button style="min-height: 52px; border: 2px solid #111315; border-radius: 4px; background: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700">REMIND ME</button>
    <a href="B-Map.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: #111315; color: #FFFFFF; text-decoration: none; font-size: 18px; font-weight: 700">ON THE MAP</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['Roma Street', 'BOARD', '08:07', 'you'], ['Milton', 'PASSES', '', 'skip'], ['Auchenflower', 'PASSES', '', 'skip'],
      ['Toowong', 'STOPS', '08:13', 'stop'], ['Taringa', 'PASSES', '', 'skip'], ['Indooroopilly', 'GET OFF', '08:19', 'you'],
      ['Darra', 'STOPS', '08:27', 'stop'], ['Springfield Central', 'TERMINATES', '08:42', 'stop']
    ];
    const stops = data.map(([label, state, time, k]) => ({
      label, state, time,
      row: 'display: flex; align-items: center; gap: 10px; min-height: 40px; border-top: 1px solid #ECECE8',
      mark: k === 'skip' ? 'width: 10px; height: 10px; border: 2px solid #0A7A6E; border-radius: 50%; box-sizing: border-box; margin: 0 3px' : k === 'you' ? 'width: 16px; height: 16px; background: #5B3FD1; border-radius: 2px' : 'width: 16px; height: 16px; background: #0A7A6E; border-radius: 50%',
      name: 'flex: 1; font-size: 19px; text-transform: uppercase; ' + (k === 'skip' ? 'font-weight: 500; color: #5C6066' : 'font-weight: 700'),
      status: 'font-size: 13px; font-weight: 700; letter-spacing: 0.06em; ' + (k === 'you' ? 'color: #FFFFFF; background: #5B3FD1; padding: 1px 6px' : k === 'skip' ? 'color: #5C6066' : 'color: #111315')
    }));
    return { stops };
  }
}
</script>
</body>
</html>
