<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Departures, Platform Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#4A2FC0}a:hover{color:#331F8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EDEDEA; font-family: 'Barlow Condensed', system-ui, sans-serif; color: #111315; display: flex; flex-direction: column">
  <header style="background: #111315; color: #FFFFFF; padding: 12px 12px 0">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="B-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
      <h1 style="flex: 1; margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase; line-height: 1">Roma St → Indooroopilly</h1>
      <button aria-label="Swap direction" style="width: 44px; height: 44px; border: 1px solid #3A3D42; border-radius: 4px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg></button>
    </div>
    <div role="tablist" aria-label="Service filter" style="display: flex; gap: 20px; padding: 8px 6px 0">
      <button role="tab" aria-selected="true" style="min-height: 44px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700; border-bottom: 4px solid #A996FF; padding: 0 2px">ALL SERVICES</button>
      <button role="tab" aria-selected="false" style="min-height: 44px; border: 0; background: transparent; color: #B9BCC0; font: inherit; font-size: 18px; font-weight: 600; border-bottom: 4px solid transparent; padding: 0 2px">EXPRESS</button>
      <span style="margin-left: auto; align-self: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #B9BCC0">08:04</span>
    </div>
  </header>
  <a href="B-Alerts.dc.html" style="display: flex; align-items: center; gap: 8px; background: #FFB547; color: #111315; padding: 0 14px; min-height: 44px; text-decoration: none; font-size: 17px; font-weight: 700">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path></svg>
    <span style="flex: 1">IPSWICH LINE: REDUCED AFTER 7 PM</span><span>›</span>
  </a>
  <div style="display: grid; grid-template-columns: 60px 1fr 64px; gap: 10px; padding: 10px 14px 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #4A4E54">
    <span>PLAT</span><span>DEPARTS · TO</span><span style="text-align: right">DUE</span>
  </div>
  <main style="flex: 1; overflow: hidden; padding: 0 8px; display: flex; flex-direction: column; gap: 3px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <a href="B-Detail.dc.html" style="display: grid; grid-template-columns: 60px 1fr 64px; gap: 10px; align-items: center; background: #FFFFFF; padding: 10px 6px; text-decoration: none; color: #111315">
        <span style="{{r.tile}}"><span style="font-size: 9px; font-weight: 800; letter-spacing: 0.1em">{{r.tileLabel}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 800; line-height: 1">{{r.plat}}</span></span>
        <span style="min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px"><span style="{{r.timeStyle}}">{{r.time}}</span><span style="{{r.destStyle}}">{{r.dest}}</span></span>
          <span style="display: flex; gap: 5px; margin-top: 3px; align-items: center; flex-wrap: wrap"><span style="{{r.linePill}}">{{r.line}}</span><span style="{{r.tagStyle}}">{{r.tag}}</span></span>
        </span>
        <span style="text-align: right"><span style="{{r.dueStyle}}">{{r.due}}</span><span style="display: block; font-size: 12px; font-weight: 700">{{r.dueUnit}}</span></span>
      </a>
    </sc-for>
  </main>
  <div style="padding: 10px 12px 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="B-Map.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #111315; border-radius: 4px; color: #111315; text-decoration: none; font-size: 18px; font-weight: 700">LIVE MAP</a>
    <button style="min-height: 52px; border: 0; border-radius: 4px; background: #111315; color: #FFFFFF; font: inherit; font-size: 18px; font-weight: 700">LATER TRAINS</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const col = { SPRINGFIELD: '#0A7A6E', IPSWICH: '#1E9F4A' };
    const tags = {
      LIVE: 'font-size: 13px; font-weight: 700; color: #17602E',
      SCHEDULED: 'font-size: 13px; font-weight: 600; color: #4A4E54',
      CANCELLED: 'font-size: 13px; font-weight: 800; color: #FFFFFF; background: #B3261E; padding: 1px 6px',
      CHANGED: 'font-size: 13px; font-weight: 700; color: #8A4200'
    };
    const tileBase = 'width: 56px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 4px; ';
    const rows = [
      ['8', '08:07', 'Springfield Central', 'SPRINGFIELD', 'EXPRESS', '● LIVE', 'LIVE', '3', 'MIN', 'live'],
      ['7', '08:14', 'Rosewood', 'IPSWICH', 'ALL STOPS', 'WAS PLAT 9 · +2 LATE', 'CHANGED', '10', 'MIN', 'changed'],
      ['–', '08:17', 'Rosewood', 'IPSWICH', 'ALL STOPS', 'CANCELLED', 'CANCELLED', '', '', 'cancel'],
      ['8', '08:22', 'Springfield Central', 'SPRINGFIELD', 'EXPRESS', 'SCHEDULED', 'SCHEDULED', '18', 'MIN', ''],
      ['9', '08:27', 'Ipswich', 'IPSWICH', 'ALL STOPS', 'SCHEDULED', 'SCHEDULED', '23', 'MIN', ''],
      ['8', '08:37', 'Springfield Central', 'SPRINGFIELD', 'EXPRESS', 'SCHEDULED', 'SCHEDULED', '33', 'MIN', ''],
      ['9', '08:42', 'Rosewood', 'IPSWICH', 'ALL STOPS', 'SCHEDULED', 'SCHEDULED', '38', 'MIN', '']
    ].map(([plat, time, dest, line, pattern, tag, tagKind, due, dueUnit, k]) => ({
      plat, time, dest, tag, due, dueUnit,
      line: line + ' · ' + pattern,
      tileLabel: k === 'changed' ? 'NOW' : 'PLAT',
      tile: tileBase + (k === 'changed' ? 'background: #FFB547; color: #111315' : k === 'cancel' ? 'background: #E2E2DE; color: #4A4E54' : 'background: #111315; color: #FFFFFF'),
      timeStyle: "font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 800; " + (k === 'cancel' ? 'text-decoration: line-through; color: #5C6066' : ''),
      destStyle: 'font-size: 21px; font-weight: 700; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (k === 'cancel' ? 'color: #5C6066' : ''),
      linePill: 'font-size: 12px; font-weight: 700; padding: 1px 5px; color: #FFFFFF; background: ' + col[line] + (pattern === 'EXPRESS' ? '' : '; opacity: 1'),
      tagStyle: tags[tagKind],
      dueStyle: "display: block; font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 800; line-height: 1; " + (k === 'live' ? 'color: #4A2FC0' : '')
    }));
    return { rows };
  }
}
</script>
</body>
</html>
