<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus · Search stops</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6400}a:hover{color:#5c4300}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFBF2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column; overflow: hidden; font-variant-numeric: tabular-nums">
  <div style="padding: 20px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <label for="q" style="font-size: 13px; font-weight: 700; color: #5F6B6D">Stop name, stop number or route</label>
    <div style="display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #2D3436; border-radius: 16px; padding: 0 8px 0 14px; height: 56px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" value="cultural" style="flex: 1; border: 0; outline: none; font: inherit; font-size: 18px; font-weight: 600; background: transparent; color: #2D3436; min-width: 0">
      <button aria-label="Clear search" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #F3EBD9; color: #2D3436; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: #2D3436; color: #fff; font: inherit; font-size: 14px; font-weight: 700">Stops</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D3AE; background: #fff; color: #2D3436; font: inherit; font-size: 14px; font-weight: 600">Routes</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E3D3AE; background: #fff; color: #2D3436; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Near me</button>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 6px 4px 2px; font-size: 13px; font-weight: 700; color: #5F6B6D; text-transform: uppercase; letter-spacing: 0.6px">Busway platforms · Cultural Centre</h2>
    <sc-for list="{{plats}}" as="p" hint-placeholder-count="4">
      <a href="A-Departures.dc.html" style="text-decoration: none; color: #2D3436; background: #fff; border-radius: 16px; padding: 12px 12px 12px 12px; display: flex; align-items: center; gap: 12px; min-height: 64px; box-sizing: border-box; box-shadow: 0 1px 4px rgba(45,52,54,0.07)">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #2D3436; color: #F2B705; font-weight: 800; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{p.letter}}</span>
        <span style="flex: 1; min-width: 0">
          <span style="display: block; font-size: 15px; font-weight: 700">{{p.name}}</span>
          <span style="display: block; font-size: 12px; color: #5F6B6D; margin-top: 2px">Stop {{p.num}} · {{p.dir}}</span>
          <span style="display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap">
            <sc-for list="{{p.routes}}" as="r" hint-placeholder-count="4"><span style="font-size: 12px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: #FDF3D0; color: #5c4300">{{r}}</span></sc-for>
          </span>
        </span>
        <button aria-label="Save stop" style="width: 44px; height: 44px; border: 0; background: transparent; color: #8A6400; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 17.3l-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"></path></svg></button>
      </a>
    </sc-for>
    <h2 style="margin: 10px 4px 2px; font-size: 13px; font-weight: 700; color: #5F6B6D; text-transform: uppercase; letter-spacing: 0.6px">Other matches</h2>
    <a href="A-Departures.dc.html" style="text-decoration: none; color: #2D3436; background: #fff; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box">
      <span style="width: 44px; height: 44px; border-radius: 12px; background: #F3EBD9; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="15" rx="3"></rect><path d="M5 12h14M8 21l1-3M16 21l-1-3"></path></svg></span>
      <span><b style="font-size: 15px">Melbourne St at Cultural Centre</b><br><span style="font-size: 12px; color: #5F6B6D">Stop 5 · South Brisbane · 280 m</span></span>
    </a>
  </div>
  <p style="margin: 0; padding: 12px 20px 24px; font-size: 13px; color: #5F6B6D">Tip: type a stop number from the pole sign, e.g. <b style="color: #2D3436">1832</b></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { plats: [
      { letter: '1', name: 'Platform 1', num: '1832', dir: 'Outbound to UQ, Toowong', routes: ['M2', '66', '199', '412'] },
      { letter: '2', name: 'Platform 2', num: '1833', dir: 'Outbound to Woolloongabba, south', routes: ['M1', '111', '130', '140', '150'] },
      { letter: '3', name: 'Platform 3', num: '1834', dir: 'Inbound to City, RBWH', routes: ['M1', 'M2', '66', '111'] },
      { letter: '4', name: 'Platform 4', num: '1835', dir: 'Inbound to King George Square', routes: ['130', '140', '150', '555'] }
    ] };
  }
}
</script>
</body>
</html>
