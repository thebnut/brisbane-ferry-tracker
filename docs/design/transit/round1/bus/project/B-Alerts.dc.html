<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus Kerbside · Alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E2224}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F0EA; font-family: 'Barlow', system-ui, sans-serif; color: #1E2224; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #1E2224; color: #fff; padding: 16px 16px 14px">
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.3px">ALERTS</h1>
    <div style="display: flex; gap: 6px; margin-top: 10px">
      <button style="height: 40px; padding: 0 14px; border-radius: 6px; border: 0; background: #F2B705; color: #1E2224; font: inherit; font-weight: 700">My routes · 2</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #4A5154; background: transparent; color: #fff; font: inherit; font-weight: 600">All · 14</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid #4A5154; background: transparent; color: #fff; font: inherit; font-weight: 600">Planned</button>
    </div>
  </header>
  <div style="flex: 1; overflow: hidden">
    <sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
      <article style="display: flex; gap: 12px; padding: 16px 16px; border-bottom: 1px solid #DDD9CF; background: {{a.bg}}">
        <div style="display: flex; flex-direction: column; gap: 4px; width: 60px; flex-shrink: 0">
          <sc-for list="{{a.routes}}" as="r" hint-placeholder-count="1"><span style="height: 36px; border-radius: 4px; background: #1E2224; color: #F2B705; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r}}</span></sc-for>
        </div>
        <div style="flex: 1">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 1px; color: {{a.sevFg}}; display: flex; align-items: center; gap: 5px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4"></path></svg>{{a.sev}} · {{a.when}}</div>
          <h2 style="margin: 4px 0 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">{{a.title}}</h2>
          <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #3B4245">{{a.body}}</p>
        </div>
      </article>
    </sc-for>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1E2224; padding: 6px 0 24px">
    <a href="B-Home.dc.html" style="text-decoration: none; color: #C3C8CA; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px">Stops</a>
    <a href="B-Map.dc.html" style="text-decoration: none; color: #C3C8CA; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px">Map</a>
    <a href="B-Alerts.dc.html" aria-current="page" style="text-decoration: none; color: #F2B705; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px">Alerts · 2</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { alerts: [
      { bg: '#FFFFFF', sev: 'DISRUPTION', sevFg: '#A3271F', when: 'NOW', title: 'Busway delays near Buranda', body: 'A breakdown is delaying outbound services by up to 10 minutes.', routes: ['66', '111', 'M1'] },
      { bg: '#FFFFFF', sev: 'DETOUR', sevFg: '#7A5900', when: 'TONIGHT 7 PM–5 AM', title: '199 detours off Grey St', body: 'Board at Melbourne St, stop 5, instead of Cultural Centre platform 1.', routes: ['199'] },
      { bg: 'transparent', sev: 'PLANNED', sevFg: '#565D60', when: 'SAT 25 OCT', title: 'Adelaide St stops 37–39 move east', body: 'Stops move 50 m for an event. Times in the app follow the change.', routes: ['60', '330'] }
    ] };
  }
}
</script>
</body>
</html>
