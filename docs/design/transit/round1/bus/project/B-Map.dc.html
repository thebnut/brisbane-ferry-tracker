<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus Kerbside · Stop map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fff}a:hover{color:#F2B705}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #23282B; font-family: 'Barlow', system-ui, sans-serif; color: #fff; position: relative; overflow: hidden; font-variant-numeric: tabular-nums">
  <svg width="390" height="520" viewBox="0 0 390 520" role="img" aria-label="Map of buses approaching Cultural Centre platform 1: M2, 66 and 412" style="position: absolute; top: 0; left: 0">
    <rect width="390" height="520" fill="#23282B"></rect>
    <g stroke="#30373A" stroke-width="12" fill="none"><path d="M-10 140 L400 110"></path><path d="M120 -10 L150 530"></path><path d="M-10 380 L400 410"></path><path d="M300 -10 L260 530"></path></g>
    <path d="M-20 60 C 80 110, 140 40, 230 90 S 330 230, 410 200" stroke="#2D4954" stroke-width="40" fill="none"></path>
    <path d="M40 0 L120 150 L200 280" stroke="#F2B705" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round"></path>
    <path d="M390 120 L290 200 L200 280" stroke="#F2B705" stroke-width="5" fill="none" stroke-dasharray="2 9" stroke-linecap="round"></path>
    <path d="M200 280 L230 400 L250 520" stroke="#8B9396" stroke-width="5" fill="none" stroke-linecap="round"></path>
    <circle cx="200" cy="280" r="40" fill="#F2B705" fill-opacity="0.14"></circle>
    <circle cx="200" cy="280" r="16" fill="#F2B705" stroke="#0F1213" stroke-width="4"></circle>
    <text x="222" y="300" font-family="Barlow Condensed, sans-serif" font-size="16" font-weight="700" fill="#fff">Cultural Centre P1</text>
    <g font-family="Barlow Condensed, sans-serif" font-weight="800">
      <rect x="128" y="186" width="68" height="34" rx="4" fill="#0F1213" stroke="#F2B705" stroke-width="2"></rect><text x="140" y="210" font-size="20" fill="#F2B705">M2</text><text x="190" y="210" font-size="15" fill="#fff" text-anchor="end">Now</text>
      <rect x="64" y="70" width="70" height="34" rx="4" fill="#0F1213" stroke="#F2B705" stroke-width="2"></rect><text x="74" y="94" font-size="20" fill="#F2B705">66</text><text x="128" y="94" font-size="15" fill="#fff" text-anchor="end">4m</text>
      <rect x="300" y="150" width="78" height="34" rx="4" fill="#0F1213" stroke="#F2B705" stroke-width="2"></rect><text x="308" y="174" font-size="20" fill="#F2B705">412</text><text x="372" y="174" font-size="15" fill="#fff" text-anchor="end">7m</text>
    </g>
  </svg>
  <div style="position: absolute; top: 14px; left: 12px; right: 12px; display: flex; gap: 8px">
    <a href="B-Departures.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 8px; background: #0F1213; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; height: 48px; border-radius: 8px; background: #0F1213; display: flex; align-items: center; padding: 0 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700">Buses heading to this stop</div>
  </div>
  <section style="position: absolute; left: 0; right: 0; bottom: 0; height: 344px; background: #F2F0EA; color: #1E2224; border-radius: 16px 16px 0 0; padding: 14px 12px 24px; box-sizing: border-box">
    <div style="display: flex; gap: 6px; margin-bottom: 8px">
      <button style="height: 40px; padding: 0 14px; border-radius: 6px; border: 0; background: #1E2224; color: #fff; font: inherit; font-weight: 700">This stop</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 6px; border: 2px solid #1E2224; background: transparent; color: #1E2224; font: inherit; font-weight: 700">Whole route 66</button>
    </div>
    <sc-for list="{{buses}}" as="b" hint-placeholder-count="3">
      <a href="B-Detail.dc.html" style="text-decoration: none; color: #1E2224; display: flex; align-items: center; gap: 12px; min-height: 72px; border-bottom: 1px solid #DDD9CF">
        <span style="width: 64px; height: 48px; border-radius: 5px; background: #1E2224; color: #F2B705; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{b.route}}</span>
        <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 700">{{b.dest}}</span><span style="display: block; font-size: 12px; font-weight: 700; color: {{b.sc}}">{{b.status}}</span></span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800">{{b.eta}}</span>
      </a>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { buses: [
      { route: 'M2', dest: 'UQ Lakes · 200 m away', status: '● LIVE · GPS · Many seats', sc: '#0D6A44', eta: 'Now' },
      { route: '66', dest: 'UQ Lakes · 1.1 km away', status: '+3 min late · Few seats', sc: '#A3271F', eta: '4' },
      { route: '412', dest: 'UQ Lakes · 2.3 km away', status: '● LIVE · GPS · Express', sc: '#0D6A44', eta: '7' }
    ] };
  }
}
</script>
</body>
</html>
