<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus · My stops</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8A6400}a:hover{color:#5c4300}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFBF2; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column; overflow: hidden; font-variant-numeric: tabular-nums">
  <header style="padding: 20px 20px 8px; display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 22px; letter-spacing: -0.3px">Brisbane<b style="font-weight: 800; color: #2D3436; background: #F2B705; padding: 0 6px; border-radius: 6px; margin-left: 1px">Bus</b></div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #EADFC6; background: #fff; display: flex; align-items: center; justify-content: center; color: #2D3436">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>
  <div style="padding: 4px 20px 12px; display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.6px">My stops</h1>
    <span style="font-size: 13px; color: #5F6B6D">Updated 8:14 am</span>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{stops}}" as="s" hint-placeholder-count="2">
      <section style="background: #fff; border-radius: 20px; box-shadow: 0 2px 10px rgba(45,52,54,0.08); padding: 16px 16px 8px">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px">
          <div>
            <div style="font-size: 17px; font-weight: 700">{{s.name}}</div>
            <div style="font-size: 13px; color: #5F6B6D; margin-top: 2px">{{s.meta}}</div>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #0F6B45; display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; background: #E3F4EA"><span style="width: 7px; height: 7px; border-radius: 4px; background: #13865A"></span>LIVE</span>
        </div>
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #F3EBD9">
            <span style="min-width: 52px; height: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 10px; background: #F2B705; color: #2D3436; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">{{r.route}}</span>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.dest}}</div>
              <div style="font-size: 12px; color: {{r.noteColor}}; font-weight: 600">{{r.note}}</div>
            </div>
            <span style="min-width: 64px; text-align: center; padding: 7px 10px; border-radius: 999px; font-weight: 800; font-size: 15px; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.when}}</span>
          </div>
        </sc-for>
      </section>
    </sc-for>
    <a href="A-Search.dc.html" style="text-decoration: none; color: #2D3436; display: flex; align-items: center; gap: 12px; border: 2px dashed #E3D3AE; border-radius: 20px; padding: 14px 16px; min-height: 48px; box-sizing: border-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A6400" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      <span style="flex: 1"><b style="font-size: 15px">3 stops near you</b><br><span style="font-size: 13px; color: #5F6B6D">Closest: Logan Rd at Stones Corner, 140 m</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #fff; border-top: 1px solid #EFE5CF; padding: 6px 8px 22px">
    <a href="Main.dc.html" aria-current="page" style="text-decoration: none; color: #2D3436; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; min-height: 52px; justify-content: center"><span style="background: #FDF3D0; border-radius: 999px; padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 17.3l-6.2 3.6 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"></path></svg></span>My stops</a>
    <a href="A-Search.dc.html" style="text-decoration: none; color: #5F6B6D; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; min-height: 52px; justify-content: center"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>Search</a>
    <a href="A-Map.dc.html" style="text-decoration: none; color: #5F6B6D; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; min-height: 52px; justify-content: center"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></span>Map</a>
    <a href="A-Alerts.dc.html" style="text-decoration: none; color: #5F6B6D; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; min-height: 52px; justify-content: center"><span style="padding: 4px 16px; display: flex; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: 2px; right: 12px; width: 9px; height: 9px; border-radius: 5px; background: #B3261E; border: 2px solid #fff"></span></span>Alerts</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const soon = { chipBg: '#F2B705', chipFg: '#2D3436' };
    const now = { chipBg: '#2D3436', chipFg: '#FFFFFF' };
    const later = { chipBg: '#FDF3D0', chipFg: '#5c4300' };
    const ok = '#5F6B6D', late = '#A3271F';
    return {
      stops: [
        { name: 'Cultural Centre busway', meta: 'Platform 1 · Stop 1832 · to UQ, Toowong', rows: [
          { route: 'M2', dest: 'UQ Lakes', note: 'LIVE · Many seats', noteColor: ok, when: 'Now', ...now },
          { route: '66', dest: 'UQ Lakes via Mater Hill', note: '+3 min late', noteColor: late, when: '4 min', ...soon },
          { route: '199', dest: 'West End', note: 'Scheduled', noteColor: ok, when: '11 min', ...later }
        ] },
        { name: 'Adelaide St, stop 37', meta: 'Stop 37 · Brunswick St direction', rows: [
          { route: '60', dest: 'CityGlider · Teneriffe', note: 'LIVE · Few seats', noteColor: ok, when: '2 min', ...soon },
          { route: '330', dest: 'Bracken Ridge', note: 'LIVE · On time', noteColor: ok, when: '9 min', ...later },
          { route: '333', dest: 'Chermside express', note: 'Express · Scheduled', noteColor: ok, when: '16 min', ...later }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
