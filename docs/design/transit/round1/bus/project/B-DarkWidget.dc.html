<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus Kerbside · Dark mode and widgets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2B705}a:hover{color:#FFD24D}
</style>
</helmet>
<div style="width: 1200px; height: 844px; box-sizing: border-box; display: flex; font-family: 'Barlow', system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <section aria-label="Departures in dark mode" style="width: 390px; flex-shrink: 0; background: #0F1213; color: #F2F0EA; display: flex; flex-direction: column; overflow: hidden">
    <header style="padding: 14px 12px 14px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #2B3134">
      <a href="B-Departures.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F2F0EA"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <div style="flex: 1"><h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">Cultural Centre</h1><div style="font-size: 13px; color: #A9B0B3">Stop 1832</div></div>
      <span style="display: flex; flex-direction: column; align-items: center; background: #F2B705; color: #0F1213; border-radius: 6px; padding: 2px 10px"><span style="font-size: 10px; font-weight: 700; letter-spacing: 1px">PLAT</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">1</span></span>
    </header>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 76px; padding: 0 16px 0 12px; border-bottom: 1px solid #22282B; color: {{r.fg}}">
        <span style="width: 68px; height: 50px; border-radius: 5px; background: {{r.tileBg}}; border: 1px solid #343A3D; color: {{r.tileFg}}; font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{r.route}}</span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 16px; font-weight: 700; text-decoration: {{r.strike}}">{{r.dest}}</span><span style="display: block; font-size: 12px; font-weight: 700; color: {{r.sc}}">{{r.status}}</span></span>
        <span style="text-align: right"><span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 800; line-height: 0.95; color: {{r.numFg}}; text-decoration: {{r.strike}}">{{r.num}}</span><span style="display: block; font-size: 11px; font-weight: 700; color: #A9B0B3">{{r.unit}}</span></span>
      </div>
    </sc-for>
  </section>
  <section aria-label="iOS Home Screen widgets" style="flex: 1; background: #3F4A52; padding: 48px 40px; box-sizing: border-box; display: grid; grid-template-columns: 170px 364px; grid-template-rows: auto 170px auto 170px; column-gap: 28px; row-gap: 14px; align-content: start; justify-content: center">
    <div style="grid-column: 1 / 3; font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: #E6E2D9">LIGHT</div>
    <div style="width: 170px; height: 170px; border-radius: 26px; background: #F2F0EA; color: #1E2224; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(0,0,0,0.25)">
      <div style="background: #1E2224; color: #F2B705; font-family: 'Barlow Condensed', sans-serif; font-size: 54px; font-weight: 800; line-height: 1; padding: 10px 14px 6px">66</div>
      <div style="padding: 8px 14px; flex: 1; display: flex; flex-direction: column">
        <div style="font-size: 12px; font-weight: 700">Cultural Ctr P1 · UQ</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1; margin-top: auto">4 <span style="font-size: 16px">MIN</span></div>
        <div style="font-size: 11px; font-weight: 700; color: #A3271F">+3 late</div>
      </div>
    </div>
    <div style="width: 364px; height: 170px; border-radius: 26px; background: #F2F0EA; color: #1E2224; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 18px rgba(0,0,0,0.25)">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.4px"><span>CULTURAL CENTRE · P1</span><span style="color: #565D60">8:14</span></div>
      <sc-for list="{{w}}" as="x" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; height: 38px"><span style="width: 52px; height: 32px; border-radius: 4px; background: #1E2224; color: #F2B705; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{x.route}}</span><span style="flex: 1; font-size: 14px; font-weight: 600">{{x.dest}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800">{{x.when}}</span></div>
      </sc-for>
    </div>
    <div style="grid-column: 1 / 3; font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: #E6E2D9; margin-top: 18px">DARK</div>
    <div style="width: 170px; height: 170px; border-radius: 26px; background: #0F1213; color: #F2F0EA; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 18px rgba(0,0,0,0.35)">
      <div style="color: #F2B705; font-family: 'Barlow Condensed', sans-serif; font-size: 54px; font-weight: 800; line-height: 1; padding: 10px 14px 6px; border-bottom: 1px solid #2B3134">60</div>
      <div style="padding: 8px 14px; flex: 1; display: flex; flex-direction: column">
        <div style="font-size: 12px; font-weight: 700; color: #C3C8CA">Adelaide St 37 · Teneriffe</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1; margin-top: auto">NOW</div>
        <div style="font-size: 11px; font-weight: 700; color: #5BE3A3">● LIVE</div>
      </div>
    </div>
    <div style="width: 364px; height: 170px; border-radius: 26px; background: #0F1213; color: #F2F0EA; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 6px 18px rgba(0,0,0,0.35)">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.4px"><span>ADELAIDE ST · 37</span><span style="color: #A9B0B3">8:14</span></div>
      <sc-for list="{{wd}}" as="x" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; height: 38px"><span style="width: 52px; height: 32px; border-radius: 4px; background: #F2B705; color: #0F1213; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{x.route}}</span><span style="flex: 1; font-size: 14px; font-weight: 600">{{x.dest}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800">{{x.when}}</span></div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const b = { fg: '#F2F0EA', tileBg: '#1B1F21', tileFg: '#F2B705', strike: 'none', sc: '#5BE3A3', numFg: '#F2F0EA', unit: 'MIN' };
    return {
      rows: [
        { ...b, route: 'M2', dest: 'UQ Lakes', status: '● LIVE · GPS · Many seats', num: 'Now', unit: '8:14', numFg: '#F2B705' },
        { ...b, route: '66', dest: 'UQ Lakes via Mater Hill', status: '+3 min late', sc: '#FF9C8F', num: '4' },
        { ...b, route: '412', dest: 'UQ Lakes · Express', status: '● LIVE · Express', num: '7' },
        { ...b, route: '199', dest: 'West End (detour)', status: 'SCHEDULED', sc: '#A9B0B3', num: '11' },
        { ...b, route: 'M2', dest: 'UQ Lakes', status: 'CANCELLED', sc: '#FF9C8F', num: '13', strike: 'line-through', fg: '#8B9396', tileFg: '#6B7275', numFg: '#8B9396' },
        { ...b, route: '66', dest: 'UQ Lakes via Mater Hill', status: '● LIVE · Few seats', num: '16' },
        { ...b, route: 'M2', dest: 'UQ Lakes', status: 'SCHEDULED', sc: '#A9B0B3', num: '18' },
        { ...b, route: '199', dest: 'West End', status: 'SCHEDULED', sc: '#A9B0B3', num: '9:22', unit: 'AM' }
      ],
      w: [ { route: 'M2', dest: 'UQ Lakes', when: '2' }, { route: '66', dest: 'UQ Lakes', when: '4' }, { route: '412', dest: 'UQ Lakes exp', when: '7' } ],
      wd: [ { route: '60', dest: 'Teneriffe', when: 'Now' }, { route: '330', dest: 'Bracken Ridge', when: '9' }, { route: '333', dest: 'Chermside exp', when: '16' } ]
    };
  }
}
</script>
</body>
</html>
