<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mode Tabs · Ferry departures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D3436}a:hover{color:#000}
.tn{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFAF7; font-family: 'Figtree', system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFE5D9; padding: 20px 20px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 20px"><span style="font-weight: 400">Brisbane</span><span style="font-weight: 800; color: #B8400F">Ferry</span></div>
      <button aria-label="Show ferries on map" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #F2B9A1; background: #FFFFFF; font: 700 14px 'Figtree', sans-serif; color: #2D3436; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button style="flex: 1; height: 52px; border-radius: 14px; border: 0; background: #FFFFFF; text-align: left; padding: 0 14px; font: 800 18px 'Figtree', sans-serif; color: #2D3436">Bulimba <span style="font-weight: 400; color: #8A2E08">→</span> Riverside</button>
      <button aria-label="Swap direction" style="width: 52px; height: 52px; border-radius: 14px; border: 0; background: #B8400F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
    </div>
    <div role="group" aria-label="Service filter" style="display: flex; gap: 8px">
      <button aria-pressed="true" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: #2D3436; color: #FFFFFF; font: 700 14px 'Figtree', sans-serif">All services</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #F2B9A1; background: #FFFFFF; color: #2D3436; font: 700 14px 'Figtree', sans-serif">Express only</button>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <a href="A-Detail.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E6E2D9; border-radius: 16px; padding: 12px 14px; text-decoration: none; min-height: 76px; box-sizing: border-box">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="{{ r.routeStyle }}">{{ r.route }}</span>
            <span style="{{ r.statusStyle }}">{{ r.status }}</span>
            <span style="{{ r.extraStyle }}">{{ r.extra }}</span>
          </div>
          <div class="tn" style="font-size: 14px; color: #4A4F52">{{ r.line }}</div>
        </div>
        <span class="tn" style="{{ r.whenStyle }}">{{ r.when }}</span>
      </a>
    </sc-for>
  </main>
  <nav aria-label="Modes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 24px; background: #FFFFFF; border-top: 1px solid #E6E2D9">
    <a href="A-Departures.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 800; color: #2D3436; background: #FFE5D9; border-radius: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FF6B35" stroke="#2D3436" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h18l-2.5 5h-13z"/><path d="M6 14V9h12v5M10 9V5h4v4" fill="none"/></svg>Ferry</a>
    <a href="A-Detail.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B3FD1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/></svg>Train</a>
    <a href="A-Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A6400" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 10h16M7 21v-3M17 21v-3"/></svg>Bus</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6468" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Saved</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const exp = 'font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #B8400F; color: #FFFFFF';
const all = 'font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #FFE5D9; color: #8A2E08';
const live = 'font-size: 12px; font-weight: 800; color: #1C7A3E';
const sched = 'font-size: 12px; font-weight: 700; color: #5F6468';
const late = 'font-size: 12px; font-weight: 700; color: #A3330A';
const none = 'display: none';
const big = 'font-size: 28px; font-weight: 800; white-space: nowrap';
const mid = 'font-size: 20px; font-weight: 700; white-space: nowrap';
const rows = [
{ route: 'F11 Express', routeStyle: exp, status: '● LIVE', statusStyle: live, extra: 'Mooroolbin II', extraStyle: 'font-size: 12px; color: #5F6468', line: '7:34 pm → arrives 7:51 pm · 17 min', when: '3 min', whenStyle: big },
{ route: 'F1 All stops', routeStyle: all, status: '● LIVE', statusStyle: live, extra: '+4 min late', extraStyle: late, line: 'Scheduled 7:38 pm → arrives 8:06 pm', when: '11 min', whenStyle: big },
{ route: 'F11 Express', routeStyle: exp, status: 'CANCELLED', statusStyle: 'font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #2D3436; color: #FFFFFF', extra: '', extraStyle: none, line: '7:49 pm · next express 8:04 pm', when: '7:49', whenStyle: 'font-size: 20px; font-weight: 700; color: #6B7074; text-decoration: line-through; white-space: nowrap' },
{ route: 'F1 All stops', routeStyle: all, status: 'SCHEDULED', statusStyle: sched, extra: '', extraStyle: none, line: '7:53 pm → arrives 8:21 pm', when: '22 min', whenStyle: mid },
{ route: 'F11 Express', routeStyle: exp, status: 'SCHEDULED', statusStyle: sched, extra: '', extraStyle: none, line: '8:04 pm → arrives 8:21 pm', when: '33 min', whenStyle: mid },
{ route: 'F1 All stops', routeStyle: all, status: 'SCHEDULED', statusStyle: sched, extra: '', extraStyle: none, line: '8:13 pm → arrives 8:41 pm', when: '42 min', whenStyle: mid },
{ route: 'F1 All stops', routeStyle: all, status: 'SCHEDULED', statusStyle: sched, extra: '', extraStyle: none, line: 'arrives 9:11 pm', when: '8:43 pm', whenStyle: mid }
];
return { rows };
}
}
</script>
</body>
</html>
