<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mode Tabs · Service alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2D3436}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBFAF7; font-family: 'Figtree', system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 10px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D3436" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">Alerts</h1>
    </div>
    <div role="group" aria-label="Filter alerts" style="display: flex; gap: 6px; flex-wrap: wrap">
      <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #2D3436; color: #FFFFFF; font: 700 14px 'Figtree', sans-serif">My trips · 2</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #DAD5CA; background: #FFFFFF; font: 700 14px 'Figtree', sans-serif; color: #2D3436">All</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid #DAD5CA; background: #FFFFFF; font: 700 14px 'Figtree', sans-serif; color: #2D3436; display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FF6B35"></span>Ferry</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid #DAD5CA; background: #FFFFFF; font: 700 14px 'Figtree', sans-serif; color: #2D3436; display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #5B3FD1"></span>Train</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid #DAD5CA; background: #FFFFFF; font: 700 14px 'Figtree', sans-serif; color: #2D3436; display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #F2B705"></span>Bus</button>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; font-weight: 700; color: #5F6468; text-transform: uppercase; letter-spacing: 0.06em">Affecting your saved trips</div>
    <sc-for list="{{ mine }}" as="a" hint-placeholder-count="2">
      <article style="background: #FFFFFF; border: 1px solid #E6E2D9; border-radius: 16px; padding: 14px; display: flex; gap: 12px">
        <span style="{{ a.chipStyle }}">{{ a.mode }}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="{{ a.sevStyle }}">{{ a.sev }}</span>
          <span style="font-weight: 700; font-size: 16px; line-height: 1.3">{{ a.title }}</span>
          <span style="font-size: 13px; color: #5F6468">{{ a.when }}</span>
        </div>
      </article>
    </sc-for>
    <div style="font-size: 13px; font-weight: 700; color: #5F6468; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 6px">Other alerts · 14 more</div>
    <sc-for list="{{ other }}" as="a" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border: 1px solid #E6E2D9; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px">
        <span style="{{ a.chipStyle }}">{{ a.mode }}</span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
          <span style="font-weight: 700; font-size: 15px; line-height: 1.3">{{ a.title }}</span>
          <span style="font-size: 13px; color: #5F6468">{{ a.when }}</span>
        </div>
      </article>
    </sc-for>
  </main>
  <nav aria-label="Modes" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 24px; background: #FFFFFF; border-top: 1px solid #E6E2D9">
    <a href="A-Departures.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8400F" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h18l-2.5 5h-13z"/><path d="M6 14V9h12v5M10 9V5h4v4"/></svg>Ferry</a>
    <a href="A-Detail.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B3FD1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/></svg>Train</a>
    <a href="A-Search.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A6400" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="2"/><path d="M4 10h16M7 21v-3M17 21v-3"/></svg>Bus</a>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #5F6468"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5F6468" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Saved</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const chip = (bg, fg) => 'flex: none; width: 52px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: ' + bg + '; color: ' + fg;
const ferry = chip('#B8400F', '#FFFFFF'), train = chip('#5B3FD1', '#FFFFFF'), bus = chip('#F2B705', '#2D3436');
const disr = 'font-size: 12px; font-weight: 800; color: #A3330A; text-transform: uppercase; letter-spacing: 0.04em';
const plan = 'font-size: 12px; font-weight: 800; color: #3F2A9E; text-transform: uppercase; letter-spacing: 0.04em';
return {
mine: [
{ mode: 'Train', chipStyle: train, sev: 'Disruption now', sevStyle: disr, title: 'Cleveland line: delays up to 10 min after an earlier signal fault at Buranda', when: 'Since 6:55 pm · Morningside → Central' },
{ mode: 'Ferry', chipStyle: ferry, sev: 'Planned · Sat 25 Oct', sevStyle: plan, title: 'Bulimba terminal closed for maintenance, 6 am–2 pm. Use Hawthorne.', when: 'Bulimba → Riverside' }
],
other: [
{ mode: 'Bus', chipStyle: bus, title: 'Route 66: detour via Stanley St during Gabba event', when: 'Tonight 6–11 pm' },
{ mode: 'Train', chipStyle: train, title: 'Ferny Grove line: buses replace trains Sun 26 Oct', when: 'All day Sunday' },
{ mode: 'Bus', chipStyle: bus, title: 'Cultural Centre platform 2 lift out of service', when: 'Until further notice' }
]
};
}
}
</script>
</body>
</html>
