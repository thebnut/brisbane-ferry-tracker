<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nearby Everything · Leaving soon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#16191B}a:hover{color:#000}
.tn{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #16191B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="C-Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16191B" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <div><h1 style="margin: 0; font-size: 24px; font-weight: 700">Leaving soon</h1><div style="font-size: 14px; color: #4C5256">Everything within 20 min walk · by time</div></div>
    </div>
    <div role="group" aria-label="Filter by mode" style="display: flex; gap: 6px">
      <button aria-pressed="true" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: #16191B; color: #FFFFFF; font: 700 15px 'Atkinson Hyperlegible', sans-serif">All</button>
      <button aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid #B8400F; background: #FFFFFF; color: #16191B; font: 700 15px 'Atkinson Hyperlegible', sans-serif">Ferry</button>
      <button aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid #5B3FD1; background: #FFFFFF; color: #16191B; font: 700 15px 'Atkinson Hyperlegible', sans-serif">Train</button>
      <button aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid #C99700; background: #FFFFFF; color: #16191B; font: 700 15px 'Atkinson Hyperlegible', sans-serif">Bus</button>
    </div>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
      <a href="C-Detail.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 10px 12px; text-decoration: none; min-height: 72px; box-sizing: border-box">
        <span style="{{ r.badgeStyle }}">{{ r.badge }}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.dest }}</span>
          <span style="font-size: 13px; color: #4C5256">{{ r.stop }}</span>
          <span style="{{ r.statusStyle }}">{{ r.status }}</span>
        </div>
        <div style="text-align: right; display: flex; flex-direction: column; gap: 2px">
          <span class="tn" style="{{ r.whenStyle }}">{{ r.when }}</span>
          <span style="{{ r.walkStyle }}">{{ r.walk }}</span>
        </div>
      </a>
    </sc-for>
  </main>
</div>
</x-dc>

</body>
</html>
