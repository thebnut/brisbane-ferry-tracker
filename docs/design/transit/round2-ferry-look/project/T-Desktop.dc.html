<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneTrain desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<div style="min-height: 900px; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436">

<header style="background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1)">
<div style="max-width: 1152px; margin: 0 auto; padding: 6px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<img src="/_blob/c529a31f2397418a458da66f4007f78e" alt="" style="width: 100px; height: 100px">
<div style="display: flex; flex-direction: column; line-height: 1.05">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 34px; color: #2A9A9E">BrisbaneTrain</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 27px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" style="font: inherit; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 8px 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); min-height: 44px">Settings<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 8px 18px; box-shadow: 0 0 15px rgba(255,107,53,0.5); animation: pulse 2s infinite">LIVE</span>
</div>
</div>
</header>

<div style="background: linear-gradient(90deg, #FFFFFF, rgba(255,229,217,0.5)); border-bottom: 1px solid rgba(255,107,53,0.2)">
<div style="max-width: 1152px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<span style="font-size: 14px; margin-right: auto">Last updated <strong style="color: #007C99">2:41 pm</strong></span>
<button type="button" style="font: inherit; font-size: 14px; font-weight: 700; color: #FFFFFF; background: #E55A2B; border: 0; border-radius: 999px; padding: 8px 16px; min-height: 40px">All services</button>
<button type="button" style="font: inherit; font-size: 14px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 8px 16px; min-height: 40px">Express</button>
<button type="button" style="font: inherit; font-size: 14px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 8px 16px; min-height: 40px">Map</button>
<button type="button" style="font: inherit; font-size: 14px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 8px 16px; min-height: 40px">Refresh</button>
</div>
</div>

<main style="max-width: 1152px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 20px">
<div role="status" style="border-radius: 12px; padding: 12px 16px; background: #FFF4E5; border: 1px solid #FDBA74; display: flex; gap: 10px; align-items: center; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17h0"></path></svg>
<span><strong>Platform change at Roma Street:</strong> westbound Springfield services leave from platform 7 until 6 pm.</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 24px">
<sc-for list="{{boards}}" as="b" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; border-radius: 12px; padding: 12px 16px; background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(255,229,217,0.5)); border: 1px solid rgba(255,107,53,0.1); font-size: 16px; font-weight: 600; color: #007C99">{{b.title}}</h2>
<sc-for list="{{b.rows}}" as="r" hint-placeholder-count="4">
<div style="{{r.card}}">
<span style="{{r.tile}}"><span style="font-size: 10px; font-weight: 800">{{r.tileLabel}}</span><span style="font-size: 24px; font-weight: 800; line-height: 1">{{r.plat}}</span></span>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
<span style="{{r.badge}}">{{r.badgeText}}</span>
<span style="{{r.linePill}}">{{r.line}}</span>
<span style="font-size: 12px; font-weight: 700; color: #B45309">{{r.delay}}</span>
</div>
<span style="{{r.timeStyle}}">{{r.time}}</span>
<div style="position: relative; height: 14px">
<div style="{{r.bar}}"></div>
<div style="position: relative; display: flex; justify-content: space-between"><sc-for list="{{r.dots}}" as="d" hint-placeholder-count="6"><span style="{{d.style}}"></span></sc-for></div>
</div>
</div>
<span style="{{r.chip}}">{{r.in}}</span>
</div>
</sc-for>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const dot = (c, on) => on
? 'width: 14px; height: 14px; box-sizing: border-box; border-radius: 999px; background: ' + c + '; border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px ' + c
: 'width: 10px; height: 10px; margin-top: 2px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 2px solid ' + c;
const cardN = 'border-radius: 12px; padding: 16px 18px; background: rgba(255,255,255,0.9); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 14px; min-height: 96px; box-sizing: border-box';
const cardH = 'border-radius: 12px; padding: 16px 18px; background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; box-shadow: 0 0 20px rgba(255,107,53,0.45); display: flex; align-items: center; gap: 14px; min-height: 96px; box-sizing: border-box';
const tileN = 'width: 56px; height: 56px; flex: 0 0 56px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); color: #1E7C80; display: flex; flex-direction: column; align-items: center; justify-content: center';
const tileC = 'width: 56px; height: 56px; flex: 0 0 56px; border-radius: 12px; background: #FF6B35; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center';
const live = 'padding: 3px 9px; border-radius: 999px; background: #FF6B35; color: #FFFFFF; font-size: 11px; font-weight: 700';
const sched = 'padding: 3px 9px; border-radius: 999px; background: #F3F4F6; color: #4B5563; font-size: 11px; font-weight: 600';
const pill = (c) => 'padding: 3px 9px; border-radius: 999px; background: ' + c + '; color: #FFFFFF; font-size: 11px; font-weight: 700';
const chip = { hot: 'padding: 6px 14px; border-radius: 999px; background: #E55A2B; color: #FFFFFF; font-size: 18px; font-weight: 800; white-space: nowrap', warm: 'padding: 6px 14px; border-radius: 999px; background: #FF8C42; color: #2D3436; font-size: 18px; font-weight: 800; white-space: nowrap', later: 'padding: 6px 14px; border-radius: 999px; background: #DCFCE7; color: #166534; border: 1px solid #86EFAC; font-size: 17px; font-weight: 700; white-space: nowrap' };
const t = (s, big) => 'font-size: ' + (big ? 22 : 20) + 'px; font-weight: ' + (big ? 800 : 700) + '; font-variant-numeric: tabular-nums';
const row = (o) => ({
card: o.hi ? cardH : cardN, tile: o.changed ? tileC : tileN, tileLabel: o.changed ? 'NOW' : 'PLAT', plat: o.plat,
badge: o.live ? live : sched, badgeText: o.live ? 'LIVE' : 'SCHEDULED', linePill: pill(o.c), line: o.line + (o.exp ? ' · Express' : ''),
delay: o.delay || '', time: o.time, timeStyle: t(o.time, o.exp),
bar: 'position: absolute; left: 5px; right: 5px; top: 5px; height: 4px; border-radius: 2px; background: ' + o.c,
dots: o.pattern.map((v) => ({ style: dot(o.c, v) })), chip: chip[o.heat], in: o.in
});
const B = '#1F6FB2', G = '#2F8F46';
return {
boards: [
{ title: 'Roma Street → Indooroopilly', rows: [
row({ hi: true, changed: true, plat: '7', live: true, c: B, line: 'Springfield', exp: true, time: '2:45 pm → 2:56 pm', pattern: [1,0,0,1,0,1], heat: 'hot', in: '4 min' }),
row({ plat: '4', live: true, c: G, line: 'Ipswich', delay: '+3 min late', time: '2:49 pm → 3:04 pm', pattern: [1,1,1,1,1,1], heat: 'warm', in: '8 min' }),
row({ plat: '4', c: G, line: 'Rosewood', time: '3:05 pm → 3:20 pm', pattern: [1,1,1,1,1,1], heat: 'later', in: '24 min' }),
row({ plat: '7', c: B, line: 'Springfield', exp: true, time: '3:15 pm → 3:26 pm', pattern: [1,0,0,1,0,1], heat: 'later', in: '34 min' })
] },
{ title: 'Indooroopilly → Roma Street', rows: [
row({ hi: true, plat: '1', live: true, c: G, line: 'Ipswich', time: '2:43 pm → 2:58 pm', pattern: [1,1,1,1,1,1], heat: 'hot', in: '2 min' }),
row({ plat: '1', live: true, c: B, line: 'Springfield', exp: true, time: '2:52 pm → 3:03 pm', pattern: [1,0,1,0,0,1], heat: 'warm', in: '11 min' }),
row({ plat: '1', c: G, line: 'Rosewood', time: '3:01 pm → 3:16 pm', pattern: [1,1,1,1,1,1], heat: 'later', in: '20 min' }),
row({ plat: '1', c: G, line: 'Ipswich', time: '3:13 pm → 3:28 pm', pattern: [1,1,1,1,1,1], heat: 'later', in: '32 min' })
] }
]
};
}
}
</script>
</body>
</html>
