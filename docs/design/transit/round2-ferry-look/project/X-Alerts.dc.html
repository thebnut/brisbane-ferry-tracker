<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit · Service alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 8px; background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 15px -5px rgba(0,0,0,0.1)">
<div style="display: flex; align-items: center; gap: 4px">
<img src="/_blob/6cb3ef13ed0162256b2e66a39e2db32e" alt="" style="width: 56px; height: 56px">
<div style="display: flex; flex-direction: column; line-height: 1.08">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 20px; color: #2A9A9E">BrisbaneTransit</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 6px 12px; box-shadow: 0 0 15px rgba(255,107,53,0.5)">LIVE</span>
</header>

<main style="flex: 1 1 auto; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Service alerts</h1>
<span style="font-size: 13px; font-weight: 600; color: #007C99">5 active</span>
</div>

<div style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" style="font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #E55A2B; border: 0; border-radius: 999px; padding: 0 14px; height: 40px">Affects my trips · 2</button>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #374151; background: #FFFFFF; border: 1px solid rgba(255,107,53,0.25); border-radius: 999px; padding: 0 12px; height: 40px">All</button>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #007C99; background: #FFFFFF; border: 1px solid rgba(255,107,53,0.25); border-radius: 999px; padding: 0 12px; height: 40px">Ferry 1</button>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #1E7C80; background: #FFFFFF; border: 1px solid rgba(255,107,53,0.25); border-radius: 999px; padding: 0 12px; height: 40px">Train 2</button>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #B8400F; background: #FFFFFF; border: 1px solid rgba(255,107,53,0.25); border-radius: 999px; padding: 0 12px; height: 40px">Bus 2</button>
</div>

<sc-for list="{{alerts}}" as="a" hint-placeholder-count="4">
<article style="{{a.card}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="{{a.tile}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg></span>
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.05em; color: {{a.modeColor}}">{{a.mode}}</span>
<span style="margin-left: auto; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: {{a.sevBg}}; color: {{a.sevFg}}">{{a.sev}}</span>
</div>
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{a.title}}</h2>
<p style="margin: 0; font-size: 13px; line-height: 1.4; color: #374151">{{a.body}}</p>
<sc-if value="{{a.mine}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; padding: 4px 10px; border-radius: 8px; background: #FFE5D9; color: #B8400F; font-size: 12px; font-weight: 700">{{a.impact}}</span></sc-if>
</article>
</sc-for>
</main>

<nav aria-label="Modes" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 18px; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(255,107,53,0.2); margin-top: 10px">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
<a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{b.color}}; font-size: 11px; font-weight: {{b.weight}}; min-height: 52px; justify-content: center">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px; border-radius: 999px; background: {{b.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg></span>
{{b.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
ferry: 'M3 18c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M5 15l-1-5h16l-2 5M8 10V6h8v4M12 3v3',
train: 'M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 10h16M8 21l2-4M16 21l-2-4M8.5 13.5h.01M15.5 13.5h.01',
bus: 'M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 20v-3M17 20v-3M7.5 14h.01M16.5 14h.01',
near: 'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
saved: 'M6 3h12v18l-6-4-6 4z'
};
const tile = (bg, fg) => 'width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: ' + bg + '; color: ' + fg;
const plain = 'border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.9); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 6px';
const hot = 'border-radius: 12px; padding: 12px 14px; background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; box-shadow: 0 0 16px rgba(255,107,53,0.35); display: flex; flex-direction: column; gap: 6px';
const M = {
bus: { tile: tile('#FFE5D9', '#B8400F'), icon: I.bus, modeColor: '#B8400F' },
train: { tile: tile('#DDEFEF', '#1E7C80'), icon: I.train, modeColor: '#1E7C80' },
ferry: { tile: tile('#E0F6FB', '#007C99'), icon: I.ferry, modeColor: '#007C99' }
};
const tabs = [['Ferry', I.ferry, 'X-Departures.dc.html'], ['Train', I.train, 'X-Detail.dc.html'], ['Bus', I.bus, 'X-Search.dc.html'], ['Nearby', I.near, 'X-Map.dc.html'], ['Saved', I.saved, 'X-Home.dc.html']];
const active = '';
return {
alerts: [
Object.assign({ card: hot, mode: 'BUS · ROUTE 66', sev: 'DETOUR', sevBg: '#FEF3C7', sevFg: '#92400E', title: 'Route 66 detoured via Stanley St', body: 'Roadworks near Mater Hill until 10 pm. Mater Hill platform 2 is not served; use platform 1.', mine: true, impact: 'Your saved stop · about +3 min' }, M.bus),
Object.assign({ card: hot, mode: 'TRAIN · SPRINGFIELD LINE', sev: 'PLATFORM CHANGE', sevBg: '#FFE5D9', sevFg: '#B8400F', title: 'Roma Street: Springfield services from platform 7', body: 'Tonight from 8:30 pm, Springfield line trains depart platform 7 instead of 4.', mine: true, impact: 'Affects your 8:44 pm trip' }, M.train),
Object.assign({ card: plain, mode: 'FERRY · F1', sev: 'CANCELLED', sevBg: '#FEE2E2', sevFg: '#991B1B', title: '8:01 pm CityCat from Bulimba cancelled', body: 'Crew availability. The next all-stops service is 8:16 pm.', mine: false, impact: '' }, M.ferry),
Object.assign({ card: plain, mode: 'TRAIN · ALL LINES', sev: 'PLANNED', sevBg: '#F3F4F6', sevFg: '#374151', title: 'Weekend track work, Bowen Hills to Northgate', body: 'Buses replace trains Saturday and Sunday.', mine: false, impact: '' }, M.train)
],
tabs: tabs.map(([label, icon, href]) => ({ label, icon, href, color: label === active ? '#B8400F' : '#4B5563', weight: label === active ? '700' : '500', pill: label === active ? '#FFE5D9' : 'transparent' }))
};
}
}
</script>
</body>
</html>
