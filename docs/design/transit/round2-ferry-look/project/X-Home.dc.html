<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit · Saved</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 8px; background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 15px -5px rgba(0,0,0,0.1)">

<img src="/_blob/6cb3ef13ed0162256b2e66a39e2db32e" alt="" style="width: 56px; height: 56px">
<div style="display: flex; flex-direction: column; line-height: 1.08">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 20px; color: #2A9A9E">BrisbaneTransit</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007C99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>

</div>
</header>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: linear-gradient(90deg, #FFFFFF, rgba(255,229,217,0.5)); border-bottom: 1px solid rgba(255,107,53,0.2); font-size: 13px">

<span style="font-weight: 600; color: #007C99">3 saved · all modes</span>
</div>

<main style="flex: 1 1 auto; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Good evening</h1>

<sc-for list="{{trips}}" as="t" hint-placeholder-count="3">
<article style="{{t.card}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<span style="{{t.tile}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.06em; color: {{t.modeText}}">{{t.mode}}</span>
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.route}}</span>
</div>
</div>
<span style="padding: 3px 9px; border-radius: 999px; background: #FF6B35; color: #FFFFFF; font-size: 11px; font-weight: 700">LIVE</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums">{{t.time}}</span>
<span style="font-size: 13px; color: #4B5563">{{t.detail}}</span>
</div>
<span style="{{t.chip}}">{{t.count}}</span>
</div>
<div style="display: flex; gap: 8px; font-size: 13px; color: #374151; font-variant-numeric: tabular-nums; border-top: 1px dashed rgba(255,107,53,0.25); padding-top: 8px">
<span style="font-weight: 600">Then</span><span>{{t.then}}</span>
</div>
</article>
</sc-for>

<a href="X-Map.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: #2D3436; border-radius: 12px; padding: 12px 14px; background: linear-gradient(90deg, rgba(255,255,255,0.8), rgba(255,229,217,0.5)); border: 1px solid rgba(255,107,53,0.15); min-height: 48px; box-sizing: border-box">
<span style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007C99" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg><span style="font-size: 14px; font-weight: 600">5 stops within 400 m · 1 ferry, 1 train, 3 bus</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</main>

<nav aria-label="Modes" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 18px; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(255,107,53,0.2)">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
<a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{b.color}}; font-size: 11px; font-weight: {{b.weight}}; min-height: 52px; justify-content: center">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px; border-radius: 999px; background: {{b.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg></span>
{{b.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
