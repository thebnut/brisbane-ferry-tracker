<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'min-width: 60px; height: 52px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: ' + bg + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; flex: 0 0 auto; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15)';
const live = 'font-size: 11px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 2px 8px';
const sched = 'font-size: 11px; font-weight: 600; color: #4B5563; background: #F3F4F6; border-radius: 999px; padding: 2px 8px';
const canc = 'font-size: 11px; font-weight: 800; color: #FFFFFF; background: #B91C1C; border-radius: 999px; padding: 2px 8px';
const count = (c) => 'font-size: 30px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: ' + c;
const card = 'text-decoration: none; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.9); border-radius: 12px; padding: 10px 14px; min-height: 76px; box-sizing: border-box; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1)';
const hot = 'text-decoration: none; display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; border-radius: 12px; padding: 8px 12px; min-height: 76px; box-sizing: border-box; box-shadow: 0 0 20px rgba(255,107,53,0.45)';
const d = (route, dest, badge, note, noteColor, cnt, cntColor, time, opts) => Object.assign({
route, dest, badge, note, noteColor, count: cnt, time,
cardStyle: card, tileStyle: tile('#1E7C80'),
badgeStyle: badge === 'LIVE' ? live : (badge === 'CANCELLED' ? canc : sched),
countStyle: count(cntColor), timeDeco: 'none'
}, opts || {});
return {
deps: [
d('66', 'UQ Lakes', 'LIVE', 'GPS · Few seats', '#007C99', 'Now', '#C2410C', '2:42 pm', { cardStyle: hot }),
d('M2', 'UQ Lakes', 'LIVE', '+2 min late', '#C2410C', '4 min', '#C2410C', '2:45 pm', { tileStyle: tile('#C2410C') }),
d('111', 'Eight Mile Plains', 'CANCELLED', 'Next 111 in 18 min', '#4B5563', '—', '#9CA3AF', '2:49 pm', { timeDeco: 'line-through' }),
d('66', 'UQ Lakes', 'LIVE', 'On time', '#166534', '9 min', '#2D3436', '2:50 pm'),
d('111', 'Eight Mile Plains', 'SCHEDULED', 'Detour via Stanley St', '#9A3412', '18 min', '#2D3436', '2:59 pm'),
d('M2', 'UQ Lakes', 'SCHEDULED', '', '#4B5563', '24 min', '#2D3436', '3:05 pm', { tileStyle: tile('#C2410C') })
]
};
}
}
</script>
