<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus · Route 66 detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column">

<header style="background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 15px -5px rgba(0,0,0,0.1); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
<div style="display: flex; align-items: center; gap: 6px">
<a href="B-Departures.dc.html" aria-label="Back to departures" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E55A2B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<img src="/_blob/f469fc98762384bbed3dbe954bca5d44" alt="" style="width: 50px; height: 50px">
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 20px; color: #2A9A9E">BrisbaneBus</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 7px 14px; box-shadow: 0 0 15px rgba(255,107,53,0.5)">LIVE</span>
</header>

<main style="flex: 1 1 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<section style="background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; border-radius: 14px; padding: 14px; box-shadow: 0 0 20px rgba(255,107,53,0.35); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="min-width: 72px; height: 64px; border-radius: 12px; background: #1E7C80; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15)">66</span>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">UQ Lakes</h1>
<span style="display: flex; gap: 6px; align-items: center">
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 2px 8px">LIVE</span>
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #007C99; border-radius: 999px; padding: 2px 8px; display: flex; align-items: center; gap: 3px"><svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7z"></path></svg>GPS</span>
<span style="font-size: 12px; color: #166534; font-weight: 700">On time</span>
</span>
</div>
<span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 32px; font-weight: 800; color: #C2410C; line-height: 1">Now</span><span style="font-size: 12px; color: #4B5563">2:42 pm</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: rgba(255,255,255,0.9); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; color: #4B5563">Occupancy</span>
<span style="display: flex; gap: 3px" aria-hidden="true"><span style="width: 14px; height: 8px; border-radius: 2px; background: #E55A2B"></span><span style="width: 14px; height: 8px; border-radius: 2px; background: #E55A2B"></span><span style="width: 14px; height: 8px; border-radius: 2px; background: #E55A2B"></span><span style="width: 14px; height: 8px; border-radius: 2px; background: #E5E7EB"></span></span>
<span style="font-size: 13px; font-weight: 700">Few seats</span>
</div>
<div style="background: rgba(255,255,255,0.9); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; color: #4B5563">Bus</span>
<span style="font-size: 13px; font-weight: 700">#1204 · Electric</span>
<span style="font-size: 12px; color: #4B5563">Stopped at platform</span>
</div>
<div style="background: rgba(255,255,255,0.9); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 600; color: #4B5563">Journey</span>
<span style="font-size: 13px; font-weight: 700">18 min</span>
<span style="font-size: 12px; color: #4B5563">Arrive 3:00 pm</span>
</div>
</div>
</section>

<section aria-label="Stopping pattern" style="background: rgba(255,255,255,0.9); border-radius: 12px; padding: 12px 14px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); flex: 1 1 auto; overflow: hidden">
<h2 style="margin: 0 0 6px; font-size: 15px; font-weight: 700; color: #007C99">Stops on this trip</h2>
<sc-for list="{{stops}}" as="s" hint-placeholder-count="7">
<div style="display: flex; align-items: stretch; gap: 12px; min-height: 44px">
<div style="width: 28px; flex: 0 0 28px; position: relative; display: flex; justify-content: center">
<span style="position: absolute; top: 0; bottom: 0; width: 4px; left: 12px; background: {{s.lineColor}}; border-radius: 2px"></span>
<span style="{{s.dotStyle}}"></span>
</div>
<div style="flex: 1 1 auto; display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid rgba(45,52,54,0.06)">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: {{s.weight}}; color: {{s.color}}">{{s.name}}</span><span style="font-size: 12px; color: #4B5563">{{s.meta}}</span></span>
<span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{s.color}}">{{s.time}}</span>
</div>
</div>
</sc-for>
</section>
</main>

<div style="flex: 0 0 auto; padding: 12px 16px 18px; display: flex; gap: 10px; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(255,107,53,0.2)">
<a href="B-Map.dc.html" style="flex: 1 1 0; text-decoration: none; font-size: 16px; font-weight: 700; color: #FFFFFF; background: #E55A2B; border-radius: 8px; min-height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15)">Track on map</a>
<button type="button" style="flex: 1 1 0; font: inherit; font-size: 16px; font-weight: 700; color: #C2410C; background: #FFFFFF; border: 2px solid #FF6B35; border-radius: 8px; min-height: 50px">Alert me at stop</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dot = (kind) => {
if (kind === 'past') return 'position: relative; margin-top: 15px; width: 12px; height: 12px; border-radius: 999px; background: #D1D5DB; border: 2px solid #FFFFFF';
if (kind === 'bus') return 'position: relative; margin-top: 8px; width: 24px; height: 24px; border-radius: 999px; background: #FF6B35; border: 3px solid #FFFFFF; box-shadow: 0 0 0 4px rgba(255,107,53,0.3), 0 2px 4px rgba(0,0,0,0.25); box-sizing: border-box';
if (kind === 'end') return 'position: relative; margin-top: 13px; width: 16px; height: 16px; border-radius: 4px; background: #1E7C80; border: 2px solid #FFFFFF';
return 'position: relative; margin-top: 14px; width: 14px; height: 14px; border-radius: 999px; background: #FFFFFF; border: 3px solid #1E7C80; box-sizing: border-box';
};
const s = (name, meta, time, kind) => ({
name, meta, time, dotStyle: dot(kind),
lineColor: kind === 'past' ? '#D1D5DB' : '#1E7C80',
color: kind === 'past' ? '#6B7280' : '#2D3436',
weight: kind === 'bus' || kind === 'end' ? 800 : 600
});
return {
stops: [
s('King George Square', 'Departed', '2:38 pm', 'past'),
s('Cultural Centre, plat 1', 'Bus is here · your stop', '2:42 pm', 'bus'),
s('Mater Hill', 'Stop 1855', '2:45 pm', 'next'),
s('Woolloongabba', 'Stop 1860', '2:47 pm', 'next'),
s('Buranda', 'Busway · detour nearby', '2:50 pm', 'next'),
s('Boggo Road', 'Change for trains', '2:53 pm', 'next'),
s('UQ Lakes', 'Terminus', '3:00 pm', 'end')
]
};
}
}
</script>
</body>
</html>
