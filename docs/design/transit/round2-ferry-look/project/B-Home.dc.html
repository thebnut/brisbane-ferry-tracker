<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneBus · My stops</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436; display: flex; flex-direction: column">

<header style="background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 15px -5px rgba(0,0,0,0.1); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto">
<div style="display: flex; align-items: center; gap: 6px">
<img src="/_blob/f469fc98762384bbed3dbe954bca5d44" alt="" style="width: 54px; height: 54px">
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 21px; color: #2A9A9E">BrisbaneBus</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; color: #007C99; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 7px 14px; box-shadow: 0 0 15px rgba(255,107,53,0.5)">LIVE</span>
</div>
</header>

<div style="padding: 8px 16px; background: linear-gradient(90deg, #FFFFFF, rgba(255,229,217,0.5)); border-bottom: 1px solid rgba(255,107,53,0.2); display: flex; align-items: center; justify-content: space-between; font-size: 13px">
<span style="display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Updated <strong style="font-weight: 600; color: #007C99">2:41 pm</strong></span>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 6px 12px; min-height: 36px">Refresh</button>
</div>

<main style="flex: 1 1 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<h1 style="margin: 0; font-size: 20px; font-weight: 800">My stops</h1>

<sc-for list="{{stops}}" as="stop" hint-placeholder-count="2">
<section style="{{stop.cardStyle}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #007C99">{{stop.name}}</h2>
<span style="font-size: 12px; color: #4B5563; white-space: nowrap">{{stop.meta}}</span>
</div>
<sc-for list="{{stop.deps}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(45,52,54,0.06)">
<span style="{{d.tileStyle}}">{{d.route}}</span>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.dest}}</span>
<span style="font-size: 12px; color: {{d.statusColor}}; font-weight: 600">{{d.status}}</span>
</div>
<span style="{{d.chipStyle}}">{{d.when}}</span>
</div>
</sc-for>
</section>
</sc-for>
</main>

<section aria-label="Find a stop" style="flex: 0 0 auto; background: rgba(255,255,255,0.97); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.10); border-top: 1px solid rgba(255,107,53,0.2); padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #D1D5DB; align-self: center"></div>
<label for="stopsearch" style="font-size: 13px; font-weight: 700; color: #2D3436">Find a stop</label>
<div style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #FF6B35; border-radius: 12px; padding: 0 12px; height: 52px; box-shadow: 0 0 12px rgba(255,107,53,0.25)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="stopsearch" type="text" placeholder="Stop name or number" style="border: 0; outline: none; font: inherit; font-size: 17px; flex: 1 1 auto; background: transparent; color: #2D3436">
</div>
<div style="display: flex; gap: 8px">
<a href="B-Search.dc.html" style="flex: 1 1 0; text-decoration: none; display: flex; align-items: center; gap: 8px; background: #FFE5D9; border-radius: 12px; padding: 10px 12px; color: #2D3436; min-height: 44px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="display: flex; flex-direction: column; line-height: 1.2"><strong style="font-size: 13px">Mater Hill</strong><span style="font-size: 12px; color: #4B5563">120 m · 4 routes</span></span>
</a>
<a href="B-Search.dc.html" style="flex: 1 1 0; text-decoration: none; display: flex; align-items: center; gap: 8px; background: #E6F2FF; border-radius: 12px; padding: 10px 12px; color: #2D3436; min-height: 44px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#007C99" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="display: flex; flex-direction: column; line-height: 1.2"><strong style="font-size: 13px">Stanley St, stop 9</strong><span style="font-size: 12px; color: #4B5563">260 m · 6 routes</span></span>
</a>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid rgba(255,107,53,0.2); margin: 0 -16px; padding: 6px 8px 14px">
<a href="B-Home.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #E55A2B; font-size: 11px; font-weight: 700; min-height: 48px; justify-content: center"><span style="background: #FFE5D9; border-radius: 999px; padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></span>My stops</a>
<a href="B-Search.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4B5563; font-size: 11px; font-weight: 600; min-height: 48px; justify-content: center"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></span>Nearby</a>
<a href="B-Map.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4B5563; font-size: 11px; font-weight: 600; min-height: 48px; justify-content: center"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></span>Map</a>
<a href="B-Alerts.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #4B5563; font-size: 11px; font-weight: 600; min-height: 48px; justify-content: center"><span style="padding: 4px 16px; display: flex; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L2 20h20z"></path><path d="M12 10v4M12 17v.5"></path></svg></span>Alerts (2)</a>
</nav>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tile = (bg) => 'min-width: 52px; height: 44px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: ' + bg + '; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; flex: 0 0 auto';
const chip = (m) => {
const base = 'border-radius: 999px; padding: 6px 12px; font-size: 18px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; ';
if (m < 1) return base + 'background: linear-gradient(90deg, #EF4444, #FF6B35); color: #FFFFFF';
if (m <= 5) return base + 'background: #E55A2B; color: #FFFFFF';
if (m <= 15) return base + 'background: #FF8C42; color: #2D3436';
return base + 'background: #DCFCE7; color: #166534; border: 1px solid #86EFAC';
};
const dep = (route, dest, m, status, statusColor, special) => ({
route, dest, status, statusColor,
when: m < 1 ? 'Now' : m + ' min',
tileStyle: tile(special ? '#E55A2B' : '#1E7C80'),
chipStyle: chip(m)
});
const plain = 'background: rgba(255,255,255,0.9); border-radius: 12px; padding: 12px 14px 6px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1)';
const hot = 'background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; border-radius: 12px; padding: 10px 12px 4px; box-shadow: 0 0 20px rgba(255,107,53,0.35)';
return {
stops: [
{ name: 'Cultural Centre, platform 1', meta: 'Stop 1832', cardStyle: hot, deps: [
dep('66', 'UQ Lakes', 0, 'LIVE · on time', '#C2410C'),
dep('M2', 'UQ Lakes', 4, 'LIVE · +2 min late', '#C2410C'),
dep('111', 'Eight Mile Plains', 11, 'SCHEDULED', '#4B5563')
]},
{ name: 'Adelaide St, stop 37', meta: 'Stop 1771', cardStyle: plain, deps: [
dep('60', 'CityGlider · Teneriffe', 3, 'LIVE · on time', '#C2410C', true),
dep('199', 'Teneriffe', 9, 'LIVE · on time', '#C2410C'),
dep('330', 'Bracken Ridge', 22, 'SCHEDULED', '#4B5563')
]}
]
};
}
}
</script>
</body>
</html>
