<span style="font-size: 13px; color: #4B5563">{{b.meta}}</span>
</div>
<sc-for list="{{b.deps}}" as="d" hint-placeholder-count="5">
<a href="B-Detail.dc.html" style="{{d.cardStyle}}">
<span style="min-width: 64px; height: 56px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: {{d.tile}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15)">{{d.route}}</span>

<span style="display: flex; gap: 6px; align-items: center"><span style="{{d.badgeStyle}}">{{d.badge}}</span><span style="font-size: 13px; font-weight: 600; color: {{d.noteColor}}">{{d.note}}</span></span>

<span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: {{d.countColor}}">{{d.count}}</span><span style="font-size: 13px; color: #4B5563; text-decoration: {{d.deco}}">{{d.time}}</span></span>
</a>
</sc-for>
<button type="button" style="font: inherit; font-size: 16px; font-weight: 700; color: #C2410C; background: linear-gradient(90deg, #FFFFFF, #FFE5D9); border: 2px solid rgba(255,107,53,0.3); border-radius: 8px; min-height: 50px">More departures</button>
</section>
</sc-for>
</main>
