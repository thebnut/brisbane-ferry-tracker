<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const c = '#1F6FB2';
const mk = (name, note, time, kind, pos) => {
const passed = kind === 'passed';
const lineColor = passed ? '#C9D7E6' : c;
const top = pos === 'first' ? '50%' : '0';
const bottom = pos === 'last' ? '50%' : '0';
let dot = 'position: relative; align-self: center; box-sizing: border-box; border-radius: 999px; ';
if (kind === 'skip') dot += 'width: 12px; height: 12px; background: #FFFFFF; border: 2px solid ' + c;
else if (kind === 'train') dot += 'width: 22px; height: 30px; border-radius: 8px; background: #FF6B35; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2px #FF6B35, 0 0 14px rgba(255,107,53,0.6)';
else if (kind === 'you') dot += 'width: 20px; height: 20px; background: #FFFFFF; border: 5px solid #E55A2B';
else dot += 'width: 14px; height: 14px; background: ' + (passed ? '#C9D7E6' : c) + '; border: 3px solid #FFFFFF; box-shadow: 0 0 0 1px ' + lineColor;
return {
name, note, time,
lineStyle: 'position: absolute; left: 9px; width: 4px; top: ' + top + '; bottom: ' + bottom + '; background: ' + lineColor,
dotStyle: dot,
nameStyle: 'font-size: 15px; font-weight: ' + (kind === 'skip' || passed ? '500' : '700') + '; color: ' + (kind === 'skip' || passed ? '#6B7280' : '#2D3436'),
timeStyle: 'align-self: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + (kind === 'skip' || passed ? '#6B7280' : '#2D3436')
};
};
return {
stops: [
mk('Central', 'Departed', '2:42', 'passed', 'first'),
mk('Roma Street', 'Arriving · platform 7 (changed)', '2:45', 'train'),
mk('Milton', 'Passes, no stop', '—', 'skip'),
mk('Auchenflower', 'Passes, no stop', '—', 'skip'),
mk('Toowong', 'Platform 3', '2:50', 'stop'),
mk('Taringa', 'Passes, no stop', '—', 'skip'),
mk('Indooroopilly', 'Your stop · platform 2', '2:56', 'you'),
mk('Springfield Central', 'Terminates · 9 more stops', '3:24', 'stop', 'last')
]
};
}
}
</script>
