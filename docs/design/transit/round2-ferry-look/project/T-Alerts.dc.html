<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BrisbaneTrain service alerts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436">

<header style="flex: 0 0 auto; background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.12); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 6px">
<img src="/_blob/c529a31f2397418a458da66f4007f78e" alt="" style="width: 56px; height: 56px">
<div style="display: flex; flex-direction: column; line-height: 1.05">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 21px; color: #2A9A9E">BrisbaneTrain</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; color: #007C99; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 7px 14px; box-shadow: 0 0 15px rgba(255,107,53,0.5); animation: pulse 2s infinite">LIVE</span>
</div>
</header>

<main style="flex: 1 1 auto; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Service alerts</h1>
<div style="display: flex; gap: 6px">
<button type="button" style="font: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF; background: #E55A2B; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 36px">My trips</button>
<button type="button" style="font: inherit; font-size: 13px; font-weight: 600; color: #007C99; background: rgba(255,255,255,0.9); border: 1px solid rgba(255,107,53,0.2); border-radius: 999px; padding: 6px 12px; min-height: 36px">All lines</button>
</div>
</div>

<div style="border-radius: 12px; padding: 14px; background: linear-gradient(90deg, #FFE5D9, #FFFFFF); border: 2px solid #FF6B35; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17h0"></path></svg>
<span style="font-size: 12px; font-weight: 800; color: #C2410C; letter-spacing: 0.04em">AFFECTS YOUR TRIP · NOW</span>
</div>
<span style="font-size: 16px; font-weight: 700">Platform changes at Roma Street this afternoon</span>
<span style="font-size: 13px; color: #374151; line-height: 1.4">Westbound Springfield services leave from platform 7 until 6 pm while platform 4 is being repaired.</span>
</div>

<h2 style="margin: 4px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #007C99">Line status</h2>
<div style="border-radius: 12px; background: rgba(255,255,255,0.9); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: flex; flex-direction: column">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="7">
<div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #F3E7E0; min-height: 44px; box-sizing: border-box">
<span style="{{l.bar}}"></span>
<div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{l.name}}</span>
<span style="font-size: 12px; color: #4B5563">{{l.note}}</span>
</div>
<span style="{{l.chip}}">{{l.status}}</span>
</div>
</sc-for>
</div>
</main>

<nav aria-label="Main" style="flex: 0 0 auto; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(255,107,53,0.2); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px">
<a href="T-Home.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4B5563; font-size: 12px; font-weight: 600; min-height: 48px"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a href="T-Search.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4B5563; font-size: 12px; font-weight: 600; min-height: 48px"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span>Stations</a>
<a href="T-Map.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #4B5563; font-size: 12px; font-weight: 600; min-height: 48px"><span style="padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg></span>Map</a>
<a href="T-Alerts.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #E55A2B; font-size: 12px; font-weight: 700; min-height: 48px"><span style="background: #FFE5D9; border-radius: 999px; padding: 4px 16px; display: flex"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></span>Alerts</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const bar = (c) => 'width: 6px; height: 30px; border-radius: 3px; background: ' + c;
const chip = { ok: 'padding: 4px 9px; border-radius: 999px; background: #DCFCE7; color: #166534; font-size: 12px; font-weight: 700; white-space: nowrap', warn: 'padding: 4px 9px; border-radius: 999px; background: #FFEDD5; color: #9A3412; font-size: 12px; font-weight: 700; white-space: nowrap', works: 'padding: 4px 9px; border-radius: 999px; background: #E0F2FE; color: #075985; font-size: 12px; font-weight: 700; white-space: nowrap' };
const row = (name, c, status, kind, note) => ({ name, note, status, bar: bar(c), chip: chip[kind] });
return {
lines: [
row('Springfield', '#1F6FB2', 'Platform change', 'warn', 'Roma Street platform 7 until 6 pm'),
row('Ipswich/Rosewood', '#2F8F46', 'Minor delays', 'warn', 'Up to 5 min, earlier signal fault'),
row('Shorncliffe', '#2B5FA8', 'Weekend works', 'works', 'Buses replace trains Sat–Sun'),
row('Ferny Grove', '#7B3FA0', 'Good service', 'ok', 'No disruptions'),
row('Beenleigh', '#C8102E', 'Good service', 'ok', 'No disruptions'),
row('Caboolture', '#1E7C80', 'Good service', 'ok', 'No disruptions'),
row('Airport', '#B8860B', 'Good service', 'ok', 'No disruptions')
]
};
}
}
</script>
</body>
</html>
