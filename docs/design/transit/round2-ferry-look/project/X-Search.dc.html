<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transit · Bus tab stop search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Poppins:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#E55A2B}a:hover{color:#B8400F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: linear-gradient(135deg, #FFE5D9 0%, #FFFFFF 50%, #E6F2FF 100%); font-family: Inter, system-ui, sans-serif; color: #2D3436; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 8px; background: linear-gradient(90deg, #FFFFFF, #FFE5D9, #E6F2FF); border-bottom: 2px solid rgba(255,107,53,0.5); box-shadow: 0 10px 15px -5px rgba(0,0,0,0.1)">
<div style="display: flex; align-items: center; gap: 4px">
<img src="/_blob/f469fc98762384bbed3dbe954bca5d44" alt="" style="width: 56px; height: 56px">
<div style="display: flex; flex-direction: column; line-height: 1.08">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 21px; color: #2A9A9E">BrisbaneBus</span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #FE8E22">Departure Boards</span>
</div>
</div>
<span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #FF6B35; border-radius: 999px; padding: 6px 12px; box-shadow: 0 0 15px rgba(255,107,53,0.5)">LIVE</span>
</header>

<main style="flex: 1 1 auto; overflow: hidden; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 20px; font-weight: 800">Find a bus stop</h1>
<span style="font-size: 13px; font-weight: 600; color: #007C99">3 results</span>
</div>
<p style="margin: 0; font-size: 13px; color: #4B5563">Results sit just above your thumb. Nearest first.</p>

<div style="flex: 1 1 auto"></div>

<sc-for list="{{results}}" as="r" hint-placeholder-count="4">
<a href="X-Home.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2D3436; border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.9); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); min-height: 72px; box-sizing: border-box">
<span style="width: 44px; height: 44px; border-radius: 10px; background: #FFE5D9; color: #B8400F; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 0 0 auto"><span style="font-size: 9px; font-weight: 800">PLAT</span><span style="font-size: 18px; font-weight: 800; line-height: 1">{{r.plat}}</span></span>
<span style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{r.name}}</span>
<span style="font-size: 12px; color: #4B5563">Stop {{r.num}} · {{r.dist}}</span>
<span style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{r.routes}}" as="n" hint-placeholder-count="3">
<span style="min-width: 26px; padding: 2px 6px; border-radius: 6px; background: #1E7C80; color: #FFFFFF; font-size: 12px; font-weight: 800; text-align: center">{{n}}</span>
</sc-for>
</span>
</span>
<button type="button" aria-label="Save stop" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,107,53,0.25); background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg></button>
</a>
</sc-for>
</main>

<div style="margin-top: 10px; padding: 14px 14px 12px; background: #FFFFFF; border-radius: 20px 20px 0 0; box-shadow: 0 -8px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 10px">
<label for="busq" style="font-size: 13px; font-weight: 700; color: #007C99">Stop name or number</label>
<div style="display: flex; align-items: center; gap: 10px; border: 2px solid #FF6B35; border-radius: 12px; padding: 0 12px; min-height: 52px; box-shadow: 0 0 15px rgba(255,107,53,0.25)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E55A2B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="busq" type="search" value="cultural" style="flex: 1 1 auto; border: 0; outline: none; font: inherit; font-size: 17px; font-weight: 600; color: #2D3436; background: transparent; min-width: 0">
<button type="button" aria-label="Use my location" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #FFE5D9; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B8400F" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
</div>
<div style="display: flex; gap: 8px">
<span style="padding: 7px 12px; border-radius: 999px; background: #FFE5D9; color: #B8400F; font-size: 13px; font-weight: 700">Nearby</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #F3F4F6; color: #374151; font-size: 13px; font-weight: 600">My stops</span>
<span style="padding: 7px 12px; border-radius: 999px; background: #F3F4F6; color: #374151; font-size: 13px; font-weight: 600">Try "1832"</span>
</div>
</div>

<nav aria-label="Modes" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 18px; background: rgba(255,255,255,0.95); border-top: 1px solid rgba(255,107,53,0.2)">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="5">
<a href="{{b.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{b.color}}; font-size: 11px; font-weight: {{b.weight}}; min-height: 52px; justify-content: center">
<span style="display: flex; align-items: center; justify-content: center; width: 48px; height: 30px; border-radius: 999px; background: {{b.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg></span>
{{b.label}}
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const I = {
ferry: 'M3 18c2 1.5 4 1.5 6 0s4-1.5 6 0 4 1.5 6 0M5 15l-1-5h16l-2 5M8 10V6h8v4M12 3v3',
train: 'M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 10h16M8 21l2-4M16 21l-2-4M8.5 13.5h.01M15.5 13.5h.01',
bus: 'M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 20v-3M17 20v-3M7.5 14h.01M16.5 14h.01',
near: 'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',

};
const tabs = [['Ferry', I.ferry, 'X-Departures.dc.html'], ['Train', I.train, 'X-Detail.dc.html'], ['Bus', I.bus, 'X-Search.dc.html'], ['Nearby', I.near, 'X-Map.dc.html'], ['Saved', I.saved, 'X-Home.dc.html']];
const active = 'Bus';
return {
results: [
{ plat: 'D', name: 'Cultural Centre, Melbourne St', num: '1840', dist: '410 m', routes: ['60', '199', '385'] },
{ plat: '2', name: 'Cultural Centre busway station', num: '1833', dist: '280 m', routes: ['111', '130', '140', 'M1'] },
{ plat: '1', name: 'Cultural Centre busway station', num: '1832', dist: '260 m', routes: ['66', '199', 'M2'] }
],
tabs: tabs.map(([label, icon, href]) => ({ label, icon, href, color: label === active ? '#B8400F' : '#4B5563', weight: label === active ? '700' : '500', pill: label === active ? '#FFE5D9' : 'transparent' }))
};
}
}
</script>
</body>
</html>
